name: mathsolver_mobile
description: Camera-first MathSolver app for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.12.0+2
  cupertino_icons: ^1.0.8
  firebase_analytics: ^12.4.5
  firebase_app_check: ^0.4.5+2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_secure_storage: ^10.0.0
  flutter_math_fork: ^0.7.4
  http: ^1.6.0
  image_cropper: ^11.0.0
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  shared_preferences: ^2.5.5
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
